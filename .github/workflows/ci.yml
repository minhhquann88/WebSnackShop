name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      - name: Test (Microsoft.Testing.Platform, see backend/dotnet.config)
        run: >
          dotnet test -c Release --no-build
          --report-trx
          --coverage --coverage-output-format cobertura
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults

      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -Eq "High|Critical" vulnerable.txt; then
            echo "::error::Vulnerable packages found"; exit 1
          fi

      - name: Export OpenAPI
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Default: "Host=localhost;Database=ci;Username=ci;Password=ci"
          Jwt__Secret: "ci-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
          Seed__AdminEmail: "ci@example.com"
          Seed__AdminPassword: "CiPassword123"
        run: dotnet run --project src/SnackShop.Api -c Release --no-build -- --export-openapi "${{ github.workspace }}/backend/openapi.json"

      - name: OpenAPI contract is committed
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::backend/openapi.json is out of date. Run the export locally (see README) and commit it."
            exit 1
          fi

      - name: Migration script (idempotent, no database needed)
        run: |
          dotnet tool install -g dotnet-ef --version "10.*"
          dotnet ef migrations script --idempotent --no-build --configuration Release             --project src/SnackShop.Infrastructure --startup-project src/SnackShop.Api             -o ../artifacts/migrations.sql

      - name: No pending model changes
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project src/SnackShop.Infrastructure --startup-project src/SnackShop.Api

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: artifacts/migrations.sql

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API client matches backend/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts || { echo "::error::Run 'pnpm gen:api' and commit the generated client."; exit 1; }
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/src/SnackShop.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
