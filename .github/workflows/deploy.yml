name: Deploy

# Production deploy: push a tag like v1.0.0 (or run manually with a tag/sha).
# Required repository secrets: VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (private key), VPS_PORT (optional).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (existing tag in GHCR, e.g. v1.0.0 or a commit sha)
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  image:
    name: Build & push API image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/src/SnackShop.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [image]
    if: always() && (needs.image.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy infra files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "infra/docker-compose.prod.yml,infra/nginx,infra/scripts"
          target: /opt/snackshop

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/snackshop/infra
            chmod +x scripts/*.sh
            ./scripts/deploy.sh "${{ github.event.inputs.tag || github.ref_name }}"
